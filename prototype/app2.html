<title>غرفة القيادة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* التصميم: غرفة قيادة ليلية. الخريطة تملأ الشاشة، والمعلومات على ألواح معتمة فوقها. لون اللاعب نحاسي، والحلفاء فولاذي، والأعداء آجري */
:root{
  --ocean:#0b1720; --ocean2:#0f2230; --line:#06101a;
  --panel:#121e27; --panel2:#182833; --edge:#26394a;
  --text:#ece6d8; --muted:#93a1ab; --faint:#5d6d79;
  --mine:#d2a24c; --ally:#4f86b3; --foe:#b9493c; --good:#5fae7b; --warn:#d99a3e; --bad:#d4574a;
  --display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ocean);color:var(--text);font-family:var(--body);font-size:15px;overflow:hidden;
  font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:2px solid var(--mine);outline-offset:2px}
.num{font-family:var(--display);font-weight:600}
/* الخريطة */
#map{position:absolute;inset:0;touch-action:none;background:radial-gradient(120% 80% at 60% 40%,var(--ocean2),var(--ocean))}
#map svg{width:100%;height:100%;display:block}
.prov{stroke:var(--line);stroke-width:.45;vector-effect:non-scaling-stroke;transition:filter .15s}
.prov.sel{stroke:#fff;stroke-width:2.2}
.bgc{fill:#262c27;stroke:var(--line);stroke-width:.8;vector-effect:non-scaling-stroke}
.cap circle{fill:var(--text);stroke:#000;stroke-width:1.5;vector-effect:non-scaling-stroke}
.lbl{font-family:var(--display);font-weight:600;fill:var(--text);paint-order:stroke;stroke:#05090d;stroke-width:3px;stroke-linejoin:round;text-anchor:middle;pointer-events:none}
.clbl{font-family:var(--display);font-weight:700;fill:rgba(236,230,216,.55);letter-spacing:.5px;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(5,9,13,.6);stroke-width:4px}
/* الشريط العلوي */
.hud{position:relative;z-index:5;padding:calc(env(safe-area-inset-top,0px) + 8px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hud>*{pointer-events:auto}
.bar{display:flex;gap:6px;align-items:stretch}
.chip{background:rgba(18,30,39,.92);border:1px solid var(--edge);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:7px;backdrop-filter:blur(6px)}
.who{flex:1;min-width:0}
.flag{width:26px;height:18px;border-radius:3px;overflow:hidden;display:grid;grid-template-rows:1fr 1fr 1fr;box-shadow:0 0 0 1px #000}
.flag i:nth-child(1){background:#ce1126}.flag i:nth-child(2){background:#fff;display:grid;place-items:center;color:#007a3d;font-size:7px;font-style:normal;font-weight:700}.flag i:nth-child(3){background:#000}
.who b{font-family:var(--display);font-size:17px}
.who small{color:var(--muted);font-size:12px;display:block;line-height:1.1}
.kv{display:flex;flex-direction:column;line-height:1.05}
.kv small{color:var(--muted);font-size:11px}
.kv span{font-family:var(--display);font-size:16px;font-weight:600}
.pts{display:flex;gap:3px}.pts i{width:9px;height:9px;border-radius:50%;background:var(--mine)}.pts i.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--faint)}
.risk{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.risk::-webkit-scrollbar{display:none}
.rk{flex:0 0 auto;font-size:12px;padding:4px 9px;border-radius:999px;background:rgba(18,30,39,.9);border:1px solid var(--edge);color:var(--muted);display:flex;gap:6px;align-items:center}
.rk b{font-weight:600;color:var(--text)}
.dot{width:7px;height:7px;border-radius:50%}
/* أدوات الخريطة */
.tools{position:absolute;z-index:4;left:max(12px,env(safe-area-inset-left,0px));top:42%;display:flex;flex-direction:column;gap:6px}
.tool{width:44px;height:44px;border-radius:12px;background:rgba(18,30,39,.92);border:1px solid var(--edge);display:grid;place-items:center}
.tool svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* الأسفل */
.bottom{margin-top:auto;position:relative;z-index:5;padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px;pointer-events:none}
.bottom>*{pointer-events:auto}
.advice{display:flex;gap:10px;align-items:center;text-align:right;background:rgba(18,30,39,.94);border:1px solid var(--edge);border-right:3px solid var(--warn);border-radius:12px;padding:9px 12px;font-size:14px}
.advice small{color:var(--muted);display:block;font-size:12px}
.dock{display:flex;gap:8px;align-items:stretch}
.next{flex:0 0 auto;background:var(--mine);color:#1a1206;border-radius:14px;padding:0 16px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:58px}
.next b{font-family:var(--display);font-size:17px;line-height:1.1}
.next small{font-size:11px;opacity:.75}
.tabs{flex:1;display:grid;grid-template-columns:repeat(6,1fr);background:rgba(18,30,39,.95);border:1px solid var(--edge);border-radius:14px;overflow:hidden}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--muted);min-height:58px}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--mine);background:rgba(210,162,76,.1)}
/* الألواح المنزلقة */
.sheet{position:fixed;inset:auto 0 0 0;z-index:20;max-height:86%;background:var(--panel);border-top:1px solid var(--edge);border-radius:18px 18px 0 0;
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:0 -10px 40px rgba(0,0,0,.5)}
.sheet.open{transform:none}
.sh-head{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.grip{position:absolute;top:6px;left:50%;width:40px;height:4px;border-radius:2px;background:var(--edge);transform:translateX(-50%)}
.sh-head h2{font-family:var(--display);font-size:20px;margin:6px 0 0;flex:1}
.x{width:38px;height:38px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-size:18px}
.sh-body{overflow-y:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.scrim{position:fixed;inset:0;z-index:15;background:rgba(3,7,10,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
/* مكونات */
.answer{background:linear-gradient(180deg,rgba(210,162,76,.12),rgba(210,162,76,.04));border:1px solid rgba(210,162,76,.35);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.answer .cap{color:var(--muted);font-size:12px}
.answer .big{font-family:var(--display);font-size:22px;font-weight:600;line-height:1.25}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.c{font-size:12px;padding:3px 8px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.c.g{color:var(--good)}.c.b{color:var(--bad)}.c.w{color:var(--warn)}
.sec{font-size:12px;color:var(--muted);letter-spacing:.4px;margin:4px 0 -4px}
.card{background:var(--panel2);border:1px solid var(--edge);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px}
.row .grow{flex:1;min-width:0}
.meter{height:7px;border-radius:4px;background:#0c151c;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px}
.act{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;flex-direction:column;align-items:center;gap:2px}
.btn button{width:100%;min-height:46px;border-radius:12px;background:var(--panel);border:1px solid var(--edge);font-weight:600;font-size:15px}
.btn button.pri{background:var(--mine);color:#1a1206;border-color:var(--mine)}
.btn button.dng{background:var(--foe);border-color:var(--foe)}
.btn small{font-size:11.5px;color:var(--muted);text-align:center}
.btn small.g{color:var(--good)}.btn small.b{color:var(--bad)}
.budget .r{display:grid;grid-template-columns:7.5em 1fr 4.6em;gap:8px;align-items:center;font-size:13.5px}
.budget .r .v{text-align:left;font-family:var(--display)}
.unit{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center}
.unit .ic{width:34px;height:34px;border-radius:9px;background:var(--panel);display:grid;place-items:center}
.unit .ic svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.gen{display:flex;gap:3px}.gen i{width:14px;height:5px;border-radius:2px;background:var(--edge)}.gen i.on{background:var(--mine)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel2);border:1px solid var(--edge);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:9px 4px;border-radius:9px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--edge)}
.fc{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.fc div{background:var(--panel2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px}
.fc small{color:var(--muted);font-size:12px}
.fc b{font-family:var(--display);font-size:20px}
.tag{font-size:11px;color:var(--faint);text-align:center}
/* التقرير الشهري */
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));background:rgba(3,7,10,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.modal.on{opacity:1;pointer-events:auto}
.mbox{width:100%;max-width:440px;max-height:88vh;overflow-y:auto;background:var(--panel);border:1px solid var(--edge);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.mbox h3{font-family:var(--display);font-size:21px;margin:0}
.delta{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:var(--panel2);border-radius:12px;padding:10px 12px}
.delta b{font-family:var(--display);font-size:18px}
.delta small{color:var(--muted);display:block;font-size:12.5px}
/* شاشة المعركة */
#battle{position:fixed;inset:0;z-index:40;background:#071017;display:none;flex-direction:column}
#battle.on{display:flex}
.bt-top{padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:8px}
.bt-top h3{margin:0;font-family:var(--display);font-size:19px}
.phases{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.ph{font-size:11.5px;text-align:center;padding:6px 2px;border-radius:8px;background:var(--panel);color:var(--faint)}
.ph.on{color:#1a1206;background:var(--mine);font-weight:600}.ph.done{color:var(--muted)}
.scale{display:flex;align-items:center;gap:8px;font-size:12px}
.scale .meter{flex:1;height:9px;display:flex}
#bc{flex:1;width:100%;display:block}
.log{height:118px;overflow:hidden;padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.log div{color:var(--muted)}.log div:first-child{color:var(--text)}
.bt-ctl{display:flex;gap:8px;padding:10px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(14px,env(safe-area-inset-left,0px))}
.bt-ctl button{flex:1;min-height:46px;border-radius:12px;background:var(--panel);border:1px solid var(--edge);font-weight:600}
.bt-ctl button.on{border-color:var(--mine);color:var(--mine)}
.mock{position:fixed;z-index:50;top:calc(env(safe-area-inset-top,0px) + 4px);left:50%;transform:translateX(-50%);font-size:10.5px;color:var(--faint);pointer-events:none}

/* المعركة على الأرض الحقيقية */
#war{position:fixed;inset:0;z-index:45;background:#0e0c09;display:none;flex-direction:column}
#war.on{display:flex}
#wc{flex:1;width:100%;display:block;touch-action:none}
.wtop{position:absolute;z-index:3;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;background:linear-gradient(180deg,rgba(8,10,12,.92),rgba(8,10,12,0));pointer-events:none}
.wtop>*{pointer-events:auto}
.wrow{display:flex;align-items:center;gap:8px}
.wrow h3{margin:0;font-family:var(--display);font-size:17px;flex:1}
#wtime,#wforce{font-size:12.5px;color:var(--muted)}
#wobj{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.wob{display:flex;flex-direction:column;gap:3px;font-size:12px;min-width:0}.wob .meter{height:5px;background:#c0473b;width:100%;display:block}.wob .meter i{display:block;height:100%}
#wlog{font-size:12.5px;line-height:1.35;min-height:52px;display:flex;flex-direction:column;gap:1px;text-shadow:0 1px 3px #000}
.wbot{position:absolute;left:0;right:0;bottom:0;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;background:linear-gradient(0deg,rgba(8,10,12,.95),rgba(8,10,12,0))}
.word{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.word button{background:rgba(18,30,39,.95);border:1px solid var(--edge);border-radius:10px;min-height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;padding:2px}
.word button small{font-size:10px;color:var(--muted);font-weight:400}
.word button.on{border-color:var(--mine);color:var(--mine)}
.word button:disabled{opacity:.4}
.wspd{display:flex;gap:5px}
.wspd button{flex:1;min-height:40px;border-radius:10px;background:rgba(18,30,39,.95);border:1px solid var(--edge);font-weight:600;font-size:13px}
.wspd button.on{border-color:var(--mine);color:var(--mine)}
.wside{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:46%;display:flex;flex-direction:column;gap:6px}
.wside button{width:42px;height:42px;border-radius:11px;background:rgba(18,30,39,.92);border:1px solid var(--edge);font-size:18px;font-weight:700}
.wside button.on{border-color:var(--mine);color:var(--mine)}
#wsel[hidden],#whint[hidden]{display:none}
#wtime{direction:ltr;unicode-bidi:isolate}
#whint{position:absolute;z-index:3;left:50%;top:34%;transform:translateX(-50%);background:rgba(120,30,20,.92);border:1px solid #e07b6e;border-radius:10px;padding:8px 14px;font-weight:600;font-size:13px;pointer-events:none;white-space:nowrap}
#wsel{position:absolute;z-index:2;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);display:flex;align-items:center;gap:6px;background:rgba(10,18,24,.94);border:1px solid #e8c873;border-radius:12px;padding:7px 9px}
#wsel>div{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
#wsel b{font-size:13px;color:#f0d890}
#wsel small{font-size:11px;color:var(--muted)}
#wsel button{min-height:40px;min-width:40px;padding:0 10px;border-radius:9px;background:rgba(18,30,39,.95);border:1px solid var(--edge);font-weight:600;font-size:12.5px}
#wres{position:absolute;z-index:2;inset:0;display:grid;place-items:center;padding:20px 16px;background:rgba(3,7,10,.6);opacity:0;pointer-events:none;transition:opacity .2s}
#wres.on{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){.sheet,.modal,.scrim{transition:none}}
</style>

<div id="app">
  <div id="map"><svg id="svg" viewBox="0 0 1000 1300" preserveAspectRatio="xMidYMid slice"><g id="cam"><g id="g-bg"></g><g id="g-prov"></g></g><g id="ov"><g id="g-lbl"></g><g id="g-cap"></g><g id="g-front"></g></g></svg></div>

  <div class="hud">
    <div class="bar">
      <button class="chip who" data-tab="me" aria-label="دولتي">
        <span class="flag"><i></i><i>الله</i><i></i></span>
        <span><b>العراق</b><small>تشرين الأول 2026 · متوسط</small></span>
      </button>
      <div class="chip kv"><small>الخزينة</small><span>18.4 مليار</span></div>
      <div class="chip kv"><small>نقاط القرار</small><span class="pts"><i></i><i></i><i></i><i class="off"></i><i class="off"></i></span></div>
    </div>
    <div class="risk">
      <span class="rk">مؤشر القوة <b>#34</b> عالمياً</span>
      <span class="rk"><span class="dot" style="background:var(--good)"></span>الاستقرار <b>62</b></span>
      <span class="rk"><span class="dot" style="background:var(--warn)"></span>رضا الجيش <b>41</b></span>
      <span class="rk"><span class="dot" style="background:var(--bad)"></span>حرب مع <b>تركيا</b></span>
      <span class="rk">الدين <b>48%</b></span>
    </div>
  </div>

  <div class="tools">
    <button class="tool" id="zin" aria-label="تكبير"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tool" id="zout" aria-label="تصغير"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button class="tool" id="home" aria-label="دولتي"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7M6 10v10h12V10"/></svg></button>
  </div>

  <div class="bottom">
    <button class="advice" id="advice">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2" stroke-linecap="round"><path d="M12 3 2 20h20zM12 9v5M12 17h.01"/></svg>
      <span>معركة دهوك جاهزة: اضغط لتشاهدها وتقودها<small>أرض حقيقية · مشاة ودروع ومدفعية · صواريخ واعتراض · حتى 5 دقائق</small></span>
    </button>
    <div class="dock">
      <button class="next" id="next"><b>الشهر التالي</b><small>تشرين الثاني</small></button>
      <nav class="tabs" aria-label="الأقسام">
        <button class="tab" data-tab="me"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21v-9M10 21v-9M14 21v-9M19 21v-9M2.5 10 12 4l9.5 6z"/></svg>دولتي</button>
        <button class="tab" data-tab="eco"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4.5-5 4 3L19 7M15 7h4v4"/></svg>الاقتصاد</button>
        <button class="tab" data-tab="army"><svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>الجيش</button>
        <button class="tab" data-tab="tech"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/></svg>البحث</button>
        <button class="tab" data-tab="world"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>العالم</button>
        <button class="tab" data-tab="news"><svg viewBox="0 0 24 24"><path d="M4 5h12v14H6a2 2 0 0 1-2-2zM16 9h3a1 1 0 0 1 1 1v7a2 2 0 0 1-2 2h-2M7 9h6M7 12.5h6M7 16h4"/></svg>الأخبار</button>
      </nav>
    </div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" aria-live="polite"><div class="grip"></div><div class="sh-head"><h2 id="sh-title"></h2><button class="x" id="sh-x" aria-label="إغلاق">✕</button></div><div class="sh-body" id="sh-body"></div></section>

<div class="modal" id="report"><div class="mbox" id="rbox"></div></div>

<div id="battle">
  <div class="bt-top">
    <h3>عملية «درع الشمال» · دهوك</h3>
    <div class="phases" id="phases"><div class="ph">حشد</div><div class="ph">جو</div><div class="ph">صواريخ</div><div class="ph">بر</div><div class="ph">النتيجة</div></div>
    <div class="scale"><span style="color:var(--mine)">العراق</span><div class="meter" id="bal"><i style="background:var(--mine);width:50%"></i><i style="background:var(--foe);width:50%"></i></div><span style="color:var(--foe)">تركيا</span></div>
  </div>
  <canvas id="bc"></canvas>
  <div class="log" id="blog"></div>
  <div class="bt-ctl"><button data-sp="1" class="on">×1</button><button data-sp="2">×2</button><button data-sp="4">×4</button><button id="bskip">تخطي</button></div>
</div>


<div id="war">
  <canvas id="wc"></canvas>
  <div class="wtop">
    <div class="wrow"><h3>معركة دهوك</h3><span id="wtime"></span><button class="x" id="wclose" aria-label="خروج">✕</button></div>
    <div class="wrow" style="justify-content:space-between"><span id="wforce"></span></div>
    <div id="wobj"></div>
    <div id="wlog"></div>
  </div>
  <div class="wside"><button id="wzin">+</button><button id="wzout">−</button><button id="wfollow" class="on" title="تتبع المعركة">◎</button></div>
  <div class="wbot">
    <div class="word">
      <button id="wo-attack" class="on" onclick="wOrder('attack')">هجوم<small>تقدم</small></button>
      <button id="wo-hold" onclick="wOrder('hold')">تثبيت<small>ثبات ونار</small></button>
      <button id="wo-retreat" onclick="wOrder('retreat')">انسحاب<small>للخلف</small></button>
      <button id="wo-air" onclick="wOrder('air')">ضربة جوية<small></small></button>
      <button id="wo-msl" onclick="wOrder('msl')">صواريخ<small></small></button>

    </div>
    <div class="wspd"><button data-wsp="0">⏸</button><button data-wsp="1" class="on">×1</button><button data-wsp="2">×2</button><button data-wsp="4">×4</button><button data-wsp="8">×8</button><button id="wquick">حسم سريع</button></div>
  </div>

  <div id="wsel" hidden><div><b id="wsel-t"></b><small id="wsel-s"></small></div><button id="wsel-free">للخطة</button><button id="wsel-x">✕</button></div>
  <div id="wres"></div>
</div>
<div class="mock">نموذج للتصميم · الأرقام أمثلة</div>

<script>
/*__MAPDATA__*/
// ------------------------------------------------------------------ أصحاب المناطق في هذا المثال
const OWN = {IRQ:'mine', JOR:'ally', KWT:'ally', TUR:'foe'};
const NEUTRAL = ['#353d36','#3a4239','#3f453b','#363e43','#41463f','#3a3f45','#3d4436','#383d33'];
const nIdx = {}; let ni = 0;
function colorOf(c){
  const o = OWN[c];
  if (o === 'mine') return '#b98d3f';
  if (o === 'ally') return '#3f6d93';
  if (o === 'foe') return '#8f3a31';
  if (!(c in nIdx)) nIdx[c] = ni++ % NEUTRAL.length;
  return NEUTRAL[nIdx[c]];
}
// مناطق محتلة ومتنازع عليها (مثال)
const NAMES = {};
const svgNS = 'http://www.w3.org/2000/svg';
const gBg = document.getElementById('g-bg'), gP = document.getElementById('g-prov'), gF = document.getElementById('g-front'), gC = document.getElementById('g-cap'), gL = document.getElementById('g-lbl');
for (const b of MAP.bg){ const p = document.createElementNS(svgNS,'path'); p.setAttribute('d', b.d); p.setAttribute('class','bgc'); gBg.appendChild(p); }
const provEls = {};
for (const pr of MAP.prov){
  const p = document.createElementNS(svgNS,'path');
  p.setAttribute('d', pr.d); p.setAttribute('class','prov'); p.setAttribute('fill', colorOf(pr.c)); p.dataset.id = pr.id;
  gP.appendChild(p); provEls[pr.id] = p; NAMES[pr.id] = pr;
}
// الطبقة العليا بحجم ثابت على الشاشة: كل عنصر مثبت على نقطة من الخريطة ويتحرك معها دون أن يكبر
const OV = [];
function pin(group, x, y, html, minK = 0, maxK = 99){ const g = document.createElementNS(svgNS,'g'); g.innerHTML = html; group.appendChild(g); OV.push({g, x, y, minK, maxK}); return g; }
// العواصم
for (const c of MAP.caps){
  pin(gC, c.x, c.y, `<g class="cap"><circle r="4"/><text class="lbl" y="-9" font-size="17">${c.n}</text></g>`, 1.1);
}
// أسماء الدول الكبيرة
const CN = {IRQ:'العراق',SYR:'سوريا',SAU:'السعودية',IRN:'إيران',TUR:'تركيا',JOR:'الأردن',EGY:'مصر',YEM:'اليمن',OMN:'عُمان'};
const acc = {};
for (const pr of MAP.prov){ if (!CN[pr.c]) continue; const a = acc[pr.c] || (acc[pr.c] = {x:0,y:0,w:0}); const w = Math.max(1, pr.a); a.x += pr.x * w; a.y += pr.y * w; a.w += w; }
for (const c in acc){ const a = acc[c]; pin(gL, a.x / a.w, a.y / a.w + 18, `<text class="clbl" font-size="${c === 'IRQ' ? 30 : 26}">${CN[c]}</text>`, 0, 2.6); }

// الجبهة: مناطق عراقية متنازع عليها بشريط سيطرة، ورقائق فرق
function findProv(c, part){ return MAP.prov.find(p => p.c === c && p.n && p.n.includes(part)); }
const fronts = [];
const duhok = findProv('IRQ','دهوك'), erbil = findProv('IRQ','أربيل'), ninawa = findProv('IRQ','نينوى');
if (duhok) fronts.push([duhok, 41]); if (erbil) fronts.push([erbil, 78]); if (ninawa) fronts.push([ninawa, 92]);
for (const [p, ctl] of fronts){
  const el = provEls[p.id]; el.style.filter = 'brightness(1.15)';
  const w = 56, x = -w / 2, y = -26;
  pin(gF, p.x, p.y, `<rect x="${x-2}" y="${y-2}" width="${w+4}" height="11" rx="3" fill="#05090d"/><rect x="${x}" y="${y}" width="${w}" height="7" rx="2" fill="var(--foe)"/><rect x="${x}" y="${y}" width="${w * ctl / 100}" height="7" rx="2" fill="var(--mine)"/><text class="lbl" y="${y - 5}" font-size="15">${p.n.replace('محافظة ', '')} ${ctl}%</text>`);
}
const unitIcon = '<path d="M-9 3h18l-2 4h-14zM-6 3V0h10l2 3M-2 0v-2.5h5V0M3-1.3h7" fill="none" stroke="#1a1206" stroke-width="1.6" stroke-linecap="round"/>';
function chip(x, y, n, side){
  const col = side === 'mine' ? 'var(--mine)' : 'var(--foe)';
  pin(gF, x, y, `<rect x="-24" y="-12" width="48" height="24" rx="7" fill="${col}" stroke="#05090d" stroke-width="2"/><g transform="translate(10,0)">${unitIcon}</g><text x="-9" y="6" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1206" font-family="Reem Kufi">${n}</text>`);
}
if (duhok) { chip(duhok.x - 6, duhok.y + 14, 3, 'mine'); chip(duhok.x + 18, duhok.y - 30, 5, 'foe'); }
if (ninawa) chip(ninawa.x - 10, ninawa.y + 16, 4, 'mine');
const bag = findProv('IRQ','بغداد'); if (bag) chip(bag.x + 14, bag.y + 18, 2, 'mine');

// ------------------------------------------------------------------ الكاميرا: سحب وتكبير بإصبعين
const cam = document.getElementById('cam'), mapEl = document.getElementById('map'), svg = document.getElementById('svg');
let view = {k: 1.6, x: 0, y: 0};
function home(){
  const r = svg.getBoundingClientRect(); const vb = svgPoint(r.left + r.width / 2, r.top + r.height * 0.46);
  const t = bag || {x: 620, y: 560};
  view.k = 1.6; view.x = vb.x - t.x * view.k; view.y = vb.y - t.y * view.k; apply();
}
function apply(){
  cam.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
  for (const o of OV) { const vis = view.k >= o.minK && view.k <= o.maxK; o.g.style.display = vis ? '' : 'none'; if (vis) o.g.setAttribute('transform', `translate(${view.x + o.x * view.k},${view.y + o.y * view.k})`); }
}
function svgPoint(cx, cy){ const pt = svg.createSVGPoint(); pt.x = cx; pt.y = cy; return pt.matrixTransform(svg.getScreenCTM().inverse()); }
function zoomAt(cx, cy, f){
  const p = svgPoint(cx, cy); const nk = Math.min(9, Math.max(0.8, view.k * f)); const r = nk / view.k;
  view.x = p.x - (p.x - view.x) * r; view.y = p.y - (p.y - view.y) * r; view.k = nk; apply();
}
const pts = new Map(); let moved = 0, last = null, pinch = null;
mapEl.addEventListener('pointerdown', e => { mapEl.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); moved = 0; last = e; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = {d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY)}; } });
mapEl.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, e);
  if (pts.size === 2 && pinch){ const [a, b] = [...pts.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); zoomAt((a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2, d / pinch.d); pinch.d = d; moved = 99; return; }
  const p0 = svgPoint(last.clientX, last.clientY), p1 = svgPoint(e.clientX, e.clientY);
  view.x += p1.x - p0.x; view.y += p1.y - p0.y; moved += Math.abs(e.clientX - last.clientX) + Math.abs(e.clientY - last.clientY); last = e; apply();
});
mapEl.addEventListener('pointerup', e => {
  pts.delete(e.pointerId); if (pts.size < 2) pinch = null;
  if (moved < 10) { const el = document.elementFromPoint(e.clientX, e.clientY); if (el && el.classList && el.classList.contains('prov')) selectProv(el.dataset.id); }
});
mapEl.addEventListener('pointercancel', e => { pts.delete(e.pointerId); pinch = null; });
mapEl.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15); }, {passive: false});
document.getElementById('zin').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.5); };
document.getElementById('zout').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1 / 1.5); };
document.getElementById('home').onclick = home;

// ------------------------------------------------------------------ الصوت: تسجيلات حقيقية، بموضع يسار ويمين وبُعد
const SNDLBL = {tank_cannon:'مدفع دبابة',artillery:'مدفعية',artillery2:'مدفعية بصدى',mlrs:'راجمة صواريخ',ballistic_launch:'إطلاق صاروخ باليستي',missile_pass:'صاروخ يمر',explosion_big:'انفجار كبير',explosion_big2:'انفجار عميق',explosion_med:'انفجار في المعركة',explosion_med2:'انفجار ميدان',explosion_far:'انفجار بعيد',explosion_far2:'انفجار بعيد 2',intercept:'اعتراض',jet_flyby:'مقاتلة F-15 تمر',sonic_boom:'اختراق حاجز الصوت',helicopter:'مروحية عسكرية',helicopter2:'مروحية تحلّق',drone:'مسيّرة',hmg:'رشاش 50',hmg2:'رشاش ثقيل',firefight:'تبادل إطلاق نار',firefight2:'معركة أسلحة خفيفة',rifle:'بندقية',ak47:'كلاشنكوف',rpg:'قاذف RPG',bomb_drop:'سقوط قنبلة',f16_bombs:'F-16 تلقي قنابل',tank_tracks:'دبابة تتحرك',diesel:'محرك ديزل',trucks:'شاحنات عسكرية',fire:'نار',fire2:'حريق كبير',siren:'صفارة إنذار',siren2:'صفارة يدوية',missile_alert:'إنذار صاروخي',front_ambience:'أجواء الجبهة',front_ambience2:'أجواء الجبهة 2',ui_click:'ضغطة زر',ui_alert:'تنبيه',next_month:'الشهر التالي',victory:'نصر',defeat:'هزيمة',war_horn:'بوق الحرب'};
let actx = null; const BUF = {}; const LOOPS = {};
async function audioInit(){
  if (actx) return; try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
  if (actx.state === 'suspended') actx.resume();
}
document.addEventListener('pointerdown', () => { audioInit(); load('ui_click'); load('next_month'); }, {once: true});
// x: موضع على الشاشة (للتوازن يسار/يمين)، dist: 0 قريب جداً إلى 1 بعيد
const PENDING = {};
function load(k){
  if (BUF[k] || PENDING[k] || !actx || !SND[k]) return;
  PENDING[k] = 1;
  const bin = atob(SND[k].split(',')[1]), arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  actx.decodeAudioData(arr.buffer).then(buf => { BUF[k] = buf; }).catch(() => {});
}
function play(k, opt = {}){
  if (!actx) return null;
  if (!BUF[k]) { load(k); return null; }
  const src = actx.createBufferSource(); src.buffer = BUF[k]; src.loop = !!opt.loop;
  src.playbackRate.value = opt.rate || (0.92 + Math.random() * 0.16);
  const g = actx.createGain(); const dist = opt.dist || 0; g.gain.value = (opt.vol ?? 0.8) * (1 - dist * 0.75);
  let node = src;
  if (dist > 0.4) { const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5000 - dist * 4000; node.connect(lp); node = lp; }
  node.connect(g);
  if (actx.createStereoPanner && opt.x !== undefined) { const p = actx.createStereoPanner(); p.pan.value = Math.max(-1, Math.min(1, (opt.x / innerWidth) * 2 - 1)) * 0.8; g.connect(p); p.connect(actx.destination); } else g.connect(actx.destination);
  const delay = opt.delay || 0; src.start(actx.currentTime + delay);
  return {src, g};
}
function sloop(k, vol){ if (LOOPS[k] || !actx) return; if (!BUF[k]) { load(k); setTimeout(() => sloop(k, vol), 400); return; } LOOPS[k] = play(k, {loop: true, vol, rate: 1}); }
function stopLoops(){ for (const k in LOOPS) { try { LOOPS[k].g.gain.setTargetAtTime(0, actx.currentTime, .3); LOOPS[k].src.stop(actx.currentTime + 1.5); } catch (e) {} delete LOOPS[k]; } }
document.addEventListener('click', e => { if (e.target.closest('button')) play('ui_click', {vol: .35}); });

// ------------------------------------------------------------------ الألواح
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
function openSheet(title, html){ sheetAt = performance.now(); document.getElementById('sh-title').textContent = title; document.getElementById('sh-body').innerHTML = html; sheet.open = true; sheet.classList.add('open'); scrim.classList.add('on'); document.getElementById('sh-body').scrollTop = 0; }
function closeSheet(){ sheet.classList.remove('open'); scrim.classList.remove('on'); document.querySelectorAll('.tab').forEach(t => t.classList.remove('on')); if (selEl) { selEl.classList.remove('sel'); selEl = null; } }
let sheetAt = 0;
scrim.onclick = () => { if (performance.now() - sheetAt > 400) closeSheet(); }; document.getElementById('sh-x').onclick = closeSheet;
const btn = (t, sub, cls = '', subcls = '', id = '') => `<div class="btn"><button class="${cls}" ${id ? `id="${id}"` : ''}>${t}</button><small class="${subcls}">${sub}</small></div>`;
const meter = (v, col) => `<div class="meter"><i style="width:${v}%;background:${col}"></i></div>`;
let selEl = null;
function selectProv(id){
  const p = NAMES[id]; if (!p) return;
  if (selEl) selEl.classList.remove('sel'); selEl = provEls[id]; selEl.classList.add('sel'); gP.appendChild(selEl);
  const own = OWN[p.c]; const isFront = fronts.find(f => f[0].id === id);
  const ownerName = {IRQ:'العراق',TUR:'تركيا',JOR:'الأردن',KWT:'الكويت'}[p.c] || CN[p.c] || p.c;
  let h = `<div class="chips"><span class="c">${ownerName}</span>${own === 'foe' ? '<span class="c b">في حرب معك</span>' : own === 'ally' ? '<span class="c" style="color:var(--ally)">حليف</span>' : ''}${isFront ? `<span class="c w">سيطرة ${isFront[1]}%</span>` : ''}</div>`;
  h += `<div class="fc"><div><small>السكان</small><b>1.4 مليون</b></div><div><small>الناتج السنوي</small><b>6.2 مليار</b></div><div><small>الموارد</small><b>نفط · قمح</b></div><div><small>المنشآت</small><b>قاعدة · مصفاة</b></div></div>`;
  if (own === 'foe') h += `<div class="act">${btn('أطلق عملية', '5 فرق متاحة · فرصة ~64%', 'dng', '', 'op')}${btn('عرض السلام', 'سترفض: تتقدم في الحرب', '', 'b')}</div>`;
  else if (own === 'mine') h += `<div class="act">${isFront ? btn('عملية مضادة', 'فرصة ~58% · نقطتا قرار', 'pri', '', 'op') : btn('حرّك قوات', '2 فرقة هنا', 'pri')}${btn('ابنِ منشأة', 'من 0.6 مليار · 5 أشهر')}</div>`;
  else h += `<div class="act">${btn('تحسين العلاقات', '0.2 مليار · العلاقة +8', 'pri')}${btn('اتفاقية تجارية', 'تحتاج علاقة 45 (الآن 31)', '', '')}</div>`;
  openSheet(p.n || id, h);
  const op = document.getElementById('op'); if (op) op.onclick = () => openOperation(p.n);
}
function openOperation(name){
  openSheet('عملية على ' + name, `
    <div class="sec">الحجم</div><div class="seg" id="sz"><button>محدودة<br><small>2 فرقة</small></button><button class="on">واسعة<br><small>4 فرق</small></button><button>شاملة<br><small>6 فرق</small></button></div>
    <div class="sec">الدعم</div><div class="seg" id="sp"><button>بلا</button><button class="on">جوي</button><button>صاروخي</button></div>
    <div class="answer"><span class="cap">التوقع قبل الإطلاق</span><span class="big">تسقط خلال ~19 يوماً بفرصة 64%</span>
      <div class="chips"><span class="c w">خسائر ~14% من قوة الفرق</span><span class="c">الكلفة 0.9 مليار</span><span class="c">نقطتا قرار</span><span class="c">رؤيتك للعدو جيدة</span></div></div>
    <div class="act">${btn('أطلق العملية', 'تبدأ مع الشهر القادم', 'dng', '', 'launch')}${btn('شاهد مثالاً', 'شاشة المعركة', '', '', 'demo')}</div>`);
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { b.parentElement.querySelectorAll('button').forEach(x => x.classList.remove('on')); b.classList.add('on'); });
  document.getElementById('launch').onclick = () => { closeSheet(); battle(); };
  document.getElementById('demo').onclick = () => { closeSheet(); battle(); };
}
const ICON = {
  tank:'<path d="M3 15.5h18l-2.2 4H5.2zM6 15.5V12h10.5l1.8 3.5M9.5 12V9.5h5.5V12M15 10.7h7"/>',
  inf:'<circle cx="11" cy="6" r="2.6"/><path d="M6 21v-4.5a5 5 0 0 1 10 0V21M15.5 12.5 21 4M7 9.5h8"/>',
  jet:'<path d="M12 2l2 7 7 4v2l-7-2-1 5 3 2v2l-4-1-4 1v-2l3-2-1-5-7 2v-2l7-4z"/>',
  ad:'<circle cx="12" cy="13" r="7"/><path d="M12 13l5-5M12 6v1"/>',
  msl:'<path d="M14 3l7 7-9 9-4-1-1-4zM8 16l-4 4M6 13l-2 1M11 18l-1 2"/>',
  drone:'<path d="M12 9v6M5 8h14M7 8a2 2 0 1 0 0 .1M17 8a2 2 0 1 0 0 .1M9 15h6l-1 3h-4z"/>'
};
const TABS = {
  me: ['دولتي', () => `
    <div class="answer"><span class="cap">الوضع بجملة</span><span class="big">مستقرة، لكن حرب الشمال تستنزف الخزينة والجيش</span>
      <div class="chips"><span class="c">مؤشر القوة #34 عالمياً</span><span class="c g">الناتج +2.1% سنوياً</span><span class="c b">إرهاق الحرب يرتفع</span></div></div>
    <div class="sec">المخاطر (تحذير قبل الخسارة)</div>
    <div class="card">
      ${[['انقلاب','رضا الجيش 41 · التحذير تحت 35',59,'var(--warn)'],['ثورة','الاستقرار 62 · التحذير تحت 30',38,'var(--good)'],['إفلاس','الدين 48% · التحذير فوق 150%',24,'var(--good)'],['احتلال العاصمة','العدو على بعد 4 مناطق',20,'var(--good)']].map(r => `<div class="row"><span style="width:6.5em">${r[0]}</span><div class="grow">${meter(r[2], r[3])}<small style="color:var(--muted);font-size:12px">${r[1]}</small></div></div>`).join('')}

    }

// الارتفاع: الصاروخ يصعد ثم ينزل. نرسمه أكبر كلما علا، وظله يبتعد عنه

    c.globalCompositeOperation = ADDW[p.img] ? 'lighter' : 'source-over'; c.globalAlpha = Math.max(0, Math.min(1, al));
    c.setTransform(M.a * cs + M.c * sn, M.b * cs + M.d * sn, M.c * cs - M.a * sn, M.d * cs - M.b * sn, M.a * p.x + M.c * p.y + M.e, M.b * p.x + M.d * p.y + M.f); c.drawImage(im, -sz / 2, -sz / 2, sz, sz);
  }
  c.setTransform(M); c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
  if (layer === 'top') W.parts = W.parts.filter(p => p.delay > 0 || p.t < p.life);
}

// ------------------------------------------------------------------ أصوات المحركات بحسب قربها من الكاميرا
function engineSounds(){
  if (!W || typeof actx === 'undefined' || !actx) return;
  const c = W.cam, R = innerWidth / c.k * .7;
  const near = f => { let best = 1e9; for (const u of W.units) if (!u.dead && f(u)) best = Math.min(best, Math.hypot(u.x - c.x, u.y - c.y)); return Math.max(0, 1 - best / R); };
  const set = (k, v) => { const L = LOOPS[k]; if (L) L.g.gain.setTargetAtTime(v, actx.currentTime, .4); };
  set('tank_close', .55 * near(u => u.moving && (u.t === 'tank' || u.t === 'ifv')));
  set('tank_tracks', .08 + .2 * near(u => u.moving && UT[u.t].veh));
  set('footsteps', .3 * near(u => u.moving && UT[u.t].inf));
  set('helicopter', .06 + .5 * near(u => u.t === 'heli'));
  set('jet_high', .55 * near(u => u.t === 'jet'));
}

// ------------------------------------------------------------------ الحلقة والتحكم
function warLoop(now){
  const cv = wc(); if (cv && (Math.abs(cv.width - cv.clientWidth * Math.min(devicePixelRatio || 1, 2)) > 2 || Math.abs(cv.height - cv.clientHeight * Math.min(devicePixelRatio || 1, 2)) > 2)) wResize();
  const real = Math.min(.05, (now - wlast) / 1000); wlast = now;
  const dt = real * wspeed;
  if (W && !W.end && wspeed > 0) { let left = dt; while (left > 0) { const s = Math.min(.05, left); stepWar(s); left -= s; } }
  if (W) { drawWar(real * (wspeed || 0) || 0.0001); if ((W.uiT = (W.uiT || 0) - real) <= 0) { W.uiT = .25; syncWarUI(); engineSounds(); } }
  wraf = requestAnimationFrame(warLoop);
}
function startWar(){
  document.getElementById('wres').classList.remove('on');
  stopLoops(); setupWar(); wspeed = 1; document.querySelectorAll('[data-wsp]').forEach(x => x.classList.toggle('on', x.dataset.wsp === '1'));
  audioInit(); ['front_ambience','tank_tracks','tank_close','footsteps','tank_cannon','hmg','hmg2','ak47','rifle','artillery','artillery2','explosion_big','explosion_med','explosion_med2','intercept','missile_pass','mlrs','jet_flyby','jet_high','drone','helicopter','war_horn','victory','defeat','atgm_launch','missile_fly','jet_release','armor_hit','ricochet','debris','rocket_one','incoming','rocket_salvo','heli_gun','cookoff','radio','smoke_pop','missile_alert'].forEach(k => setTimeout(() => load(k), 5));
  setTimeout(() => { sloop('front_ambience', .25); sloop('tank_tracks', .08); sloop('tank_close', 0); sloop('footsteps', 0); sloop('helicopter', .06); sloop('jet_high', 0); }, 600);
  wResize(); syncWarUI();
}
function war(){ document.getElementById('war').classList.add('on'); startWar(); cancelAnimationFrame(wraf); wlast = performance.now(); wraf = requestAnimationFrame(warLoop); }
function closeWar(){ document.getElementById('war').classList.remove('on'); document.getElementById('wres').classList.remove('on'); cancelAnimationFrame(wraf); stopLoops(); W = null; }
addEventListener('resize', () => { if (W) wResize(); });
// لمس: نقرة = تحديد أو أمر، وسحب = تحريك الكاميرا، وإصبعان = تكبير
(function(){
  const pts = new Map(); let pinch = 0, last = null;
  const c = wc();
  let down = null, moved = 0;
  c.addEventListener('pointerdown', e => { c.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); last = e; if (pts.size === 1) { down = {x: e.clientX, y: e.clientY, t: performance.now()}; moved = 0; } if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); } });
  c.addEventListener('pointermove', e => { if (!W || !pts.has(e.pointerId)) return; pts.set(e.pointerId, e);
    if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()]; const d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); W.cam.k = Math.max(.4, Math.min(6, W.cam.k * d / pinch)); pinch = d; W.follow = false; moved = 99; return; }
    moved += Math.abs(e.clientX - last.clientX) + Math.abs(e.clientY - last.clientY);
    if (moved < 10) { last = e; return; }
    W.cam.x -= (e.clientX - last.clientX) / W.cam.k; W.cam.y -= (e.clientY - last.clientY) / W.cam.k; last = e; W.follow = false; document.getElementById('wfollow').classList.remove('on'); });
  c.addEventListener('pointerup', e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = 0; if (down && moved < 10 && performance.now() - down.t < 600 && pts.size === 0) { const r = c.getBoundingClientRect(); wTap(e.clientX - r.left, e.clientY - r.top); } if (pts.size === 0) down = null; });
  c.addEventListener('pointercancel', e => { pts.delete(e.pointerId); pinch = 0; });
  c.addEventListener('wheel', e => { e.preventDefault(); if (W) { W.cam.k = Math.max(.4, Math.min(6, W.cam.k * (e.deltaY < 0 ? 1.15 : 1 / 1.15))); } }, {passive: false});
})();
document.querySelectorAll('[data-wsp]').forEach(b => b.onclick = () => { wspeed = +b.dataset.wsp; document.querySelectorAll('[data-wsp]').forEach(x => x.classList.toggle('on', x === b)); });
document.getElementById('wfollow').onclick = () => { if (W) { W.follow = !W.follow; document.getElementById('wfollow').classList.toggle('on', W.follow); } };
document.getElementById('wzin').onclick = () => { if (W) W.cam.k = Math.min(6, W.cam.k * 1.4); };
document.getElementById('wzout').onclick = () => { if (W) W.cam.k = Math.max(.4, W.cam.k / 1.4); };
document.getElementById('wclose').onclick = closeWar;
document.getElementById('wquick').onclick = () => { if (!W || W.end) return; let n = 0; while (!W.end && n < 6000) { stepWar(.05); n++; } };

// ------------------------------------------------------------------ التحكم المباشر: تحديد وحدة ثم أمرها
function hint(t){ const el = document.getElementById('whint'); el.textContent = t; el.hidden = !t; }
function wTap(sx, sy){
  if (!W || W.end) return;
  const cv = wc(), x = (sx - cv.clientWidth / 2) / W.cam.k + W.cam.x, y = (sy - cv.clientHeight / 2) / W.cam.k + W.cam.y;
  if (W.aim) { W.aimAt = {x, y}; const k = W.aim; W.aim = null; hint(''); wOrder(k + '-go'); W.aimAt = null; wp('flare', x, y, {s0: 8, s1: 24, life: .8}); return; }
  const R = Math.max(10, 20 / W.cam.k);
  let hitU = null, bd = R;
  for (const u of W.units) { if (u.dead || u.t === 'jet' || u.t === 'drone' || u.t === 'recon') continue; const r = Math.hypot(u.x - x, u.y - y); if (r < bd) { bd = r; hitU = u; } }
  if (hitU && hitU.side === 'iq') {
    if (W.sel.length === 1 && W.sel[0] === hitU.id && hitU.grp) W.sel = W.units.filter(u => u.side === 'iq' && !u.dead && u.grp === hitU.grp).map(u => u.id);
    else W.sel = [hitU.id];
    selUI(); return;
  }
  if (!W.sel.length) return;
  const sel = W.units.filter(u => W.sel.includes(u.id) && !u.dead);
  wsound('radio', W.cam.x, W.cam.y, .25);
  if (hitU && hitU.side === 'tr') {
    for (const u of sel) { u.focus = hitU.id; u.manual = {x: hitU.x, y: hitU.y}; }
    wlog(`أمر: ${sel.length > 1 ? sel.length + ' وحدات تهاجم' : NAME[sel[0].t] + ' تهاجم'} ${NAME[hitU.t]} للعدو`, 'iq');
  } else {
    const cx = sel.reduce((s, u) => s + u.x, 0) / sel.length, cy = sel.reduce((s, u) => s + u.y, 0) / sel.length;
    for (const u of sel) { u.focus = null; u.manual = {x: x + (u.x - cx) * .7, y: y + (u.y - cy) * .7}; }
    wp('flare', x, y, {s0: 5, s1: 14, life: .6});
    wlog(`أمر: ${sel.length > 1 ? sel.length + ' وحدات تتحرك' : NAME[sel[0].t] + ' تتحرك'} إلى النقطة المحددة`, 'iq');
  }
}
function selUI(){
  const box = document.getElementById('wsel'), sel = W.units.filter(u => W.sel.includes(u.id) && !u.dead);
  if (!sel.length) { box.hidden = true; return; }
  box.hidden = false;
  const u = sel[0], d = UT[u.t];
  document.getElementById('wsel-t').textContent = sel.length > 1 ? `${sel.length} وحدات · مجموعة ${u.grp || ''}` : `${NAME[u.t]} · قوة ${Math.round(u.hp / d.hp * 100)}% · معنويات ${Math.round(u.mor)}${u.sup > 55 ? ' · تحت النار' : ''}`;
  document.getElementById('wsel-s').textContent = sel.length > 1 ? 'اضغط مكاناً للتحرك أو عدواً للهجوم' : `المدى ${(d.rng / KM).toFixed(1)} كم · اضغط مكاناً أو عدواً · اضغطها ثانية لتحديد مجموعتها`;
}
document.getElementById('wsel-x').onclick = () => { if (W) { W.sel = []; selUI(); } };
document.getElementById('wsel-free').onclick = () => { if (W) { for (const u of W.units) if (W.sel.includes(u.id)) { u.manual = null; u.focus = null; } W.sel = []; selUI(); wlog('الوحدات المحددة تعود للخطة', 'iq'); } };
home();
addEventListener('resize', home, {once: true});
</script>
