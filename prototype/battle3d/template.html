<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>معركة دهوك ثلاثية الأبعاد</title>
<style>
:root{--bg:#0b0f12;--panel:rgba(10,16,21,.86);--edge:rgba(214,190,140,.28);--text:#f1ebdd;--muted:#a99f8c;--mine:#e2b04f;--foe:#e0705f;--good:#6fbf86}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f12}}
:root[data-theme="dark"]{--bg:#0b0f12}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,rgba(6,9,12,.85),rgba(6,9,12,0));pointer-events:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:16px;font-weight:700}
.chip{font-size:12px;color:var(--muted);direction:ltr;unicode-bidi:isolate}
#fps{font-weight:700;color:var(--good)}
#log{font-size:12.5px;line-height:1.5;min-height:56px}
#log div:nth-child(2){opacity:.7}#log div:nth-child(3){opacity:.45}
.bot{position:fixed;left:0;right:0;bottom:0;padding:8px 10px calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;gap:6px;background:linear-gradient(0deg,rgba(6,9,12,.92),rgba(6,9,12,0))}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
button{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--edge);border-radius:11px;min-height:48px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
button small{font-size:10.5px;color:var(--muted);font-weight:400}
button.on{border-color:var(--mine);color:var(--mine)}
button:disabled{opacity:.4}
#hint{position:fixed;left:50%;top:38%;transform:translateX(-50%);background:rgba(120,30,20,.92);border:1px solid var(--foe);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;pointer-events:none;white-space:nowrap}
#hint[hidden]{display:none}
#sel{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);background:var(--panel);border:1px solid var(--mine);border-radius:12px;padding:8px 10px;font-size:12.5px;display:flex;gap:8px;align-items:center}
#sel[hidden]{display:none}#sel b{color:var(--mine)}#sel span{flex:1}
#sel button{min-height:36px;padding:0 12px}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);font-size:14px;color:var(--muted);z-index:9}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top">
  <div class="row"><h1>معركة دهوك · تجربة ثلاثية الأبعاد</h1><span class="chip"><span id="fps">--</span> fps</span></div>
  <div class="row"><span class="chip" id="time">0:00</span><span class="chip" id="force"></span></div>
  <div id="log"></div>
</div>
<div id="hint" hidden></div>
<div id="sel" hidden><span id="selt"></span><button id="selx">✕</button></div>
<div class="bot">
  <div class="grid">
    <button id="b-attack" class="on">هجوم<small>تمهيد</small></button>
    <button id="b-hold">تثبيت<small>ثبات ونار</small></button>
    <button id="b-mlrs">راجمات<small>اختر الهدف</small></button>
    <button id="b-air">ضربة جوية<small>اختر الهدف</small></button>
  </div>
  <div class="grid">
    <button id="b-speed">السرعة<small>×3</small></button>
    <button id="b-cam" class="on">الكاميرا<small>تتبع</small></button>
    <button id="b-view">زاوية<small>منخفضة</small></button>
    <button id="b-reset">إعادة<small>من البداية</small></button>
  </div>
</div>
<div id="load">تحميل الأرض…</div>
<script>/*ASSETS*/</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js"}}</script>
<script type="module">

// ================================================================== المشهد
const canvas = document.getElementById('c');

// إذا فقد المتصفح سياق الرسم (ذاكرة الهاتف)، نعرض رسالة ويعود الرسم تلقائياً

const SUN_DIR = new THREE.Vector3(.55, .78, .32).normalize();   // الشمس من الجنوب الشرقي بعد الظهر
// الأرض: مجسم من الارتفاعات الحقيقية، عليه صورة القمر، وتفاصيل تظهر عند الاقتراب

    diffuseColor.rgb *= (1.0 + (dt.rgb * 2.0 - 1.0) * dt.a * 1.3 * fd) * (1.0 + (dt2.rgb * 2.0 - 1.0) * dt2.a * 0.35);`);

// أشجار وصخور وشجيرات حقيقية الحجم في أماكنها من صورة القمر: 7400 قطعة بثلاثة استدعاءات رسم فقط
{
  const F = new Float32Array(Uint8Array.from(atob(D3.flora), c => c.charCodeAt(0)).buffer), n = F.length / 3;

    {geo: new THREE.IcosahedronGeometry(1, 1), mat: new THREE.MeshStandardMaterial({color: 0x4d5a2c, roughness: 1, flatShading: true}), s: [3.2, 5.5], sy: .85, lift: .7},
    {geo: new THREE.DodecahedronGeometry(1, 0), mat: new THREE.MeshStandardMaterial({color: 0x8d7b62, roughness: 1, flatShading: true}), s: [1.2, 3.4], sy: .55, lift: .15},
    {geo: new THREE.IcosahedronGeometry(1, 0), mat: new THREE.MeshStandardMaterial({color: 0x7a7445, roughness: 1, flatShading: true}), s: [.8, 1.6], sy: .6, lift: .3}];

// أرض بعيدة تحت حواف المنطقة حتى لا يبان فراغ
const far = new THREE.Mesh(new THREE.PlaneGeometry(90000, 90000).rotateX(-Math.PI / 2), new THREE.MeshLambertMaterial({color: 0xa88560}));
far.position.set(SIZE / 2, -3, SIZE / 2); scene.add(far);

// ================================================================== المجسمات
const S_UNIT = 2.2;   // الوحدات مكبّرة 2.2 مرة حتى تُرى من بعيد، والمسافات حقيقية
const MAT = {};

function mkTruck(side){   // راجمة صواريخ على شاحنة
  const c = COL[side], m = mat(side + 'b', c.body), md = mat(side + 'd', c.dark), tr = mat('track', 0x2a2723);

// المشاة: كل الجنود في مجسم واحد مكرر (أخف على الهاتف)
const SOLDIERS = {};

  const geo = new THREE.CapsuleGeometry(.32, 1.1, 2, 6); geo.translate(0, .85, 0);
  const im = new THREE.InstancedMesh(geo, mat(side + 's', side === 'iq' ? 0xa08a5c : 0x4c5a3a), 220); im.count = 0; im.castShadow = true; scene.add(im); SOLDIERS[side] = im;
}

function drive(u, d, goal, sp, dt){

}

// ================================================================== الكاميرا واللمس
const cam = {tx: 5100, tz: 8700, dist: 2600, yaw: 0, pitch: .5, follow: true};
function updateCamera(dt){
  if (cam.follow && W) {

      const f = L.reduce((a, u) => u.z < a.z ? u : a), ne = nearestEnemy(f), gx = ne && ne.d < 3500 ? f.x + (ne.v.x - f.x) * .4 : f.x, gz = ne && ne.d < 3500 ? f.z + (ne.v.z - f.z) * .4 : f.z - 80;
      const want = ne ? Math.max(650, Math.min(2200, ne.d * .9)) : 1100;

const ptr = new Map(); let down = null, moved = 0, prev = null;

function snap(){ const p = [...ptr.values()]; if (p.length === 1) return {n: 1, x: p[0].x, y: p[0].y}; if (p.length >= 2) return {n: 2, x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2, d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y), a: Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x)}; return null; }
canvas.addEventListener('pointermove', e => {
  if (!ptr.has(e.pointerId)) return; ptr.set(e.pointerId, {x: e.clientX, y: e.clientY}); const s = snap(); if (!s || !prev || s.n !== prev.n) { prev = s; return; }
  if (s.n === 1) { const dx = s.x - prev.x, dy = s.y - prev.y; moved += Math.abs(dx) + Math.abs(dy); if (moved < 10) return; const k = cam.dist / innerHeight * 1.4; cam.tx -= (Math.cos(cam.yaw) * dx + Math.sin(cam.yaw) * dy) * k; cam.tz -= (-Math.sin(cam.yaw) * dx + Math.cos(cam.yaw) * dy) * k; cam.follow = false; uiCam(); }
  else { moved = 99; cam.dist = Math.max(120, Math.min(14000, cam.dist * prev.d / s.d)); cam.yaw -= ang(prev.a, s.a); cam.pitch = Math.max(.12, Math.min(1.45, cam.pitch + (s.y - prev.y) * .004)); }

const endPtr = e => { ptr.delete(e.pointerId); if (down && moved < 10 && ptr.size === 0 && performance.now() - down.t < 600) tap(e.clientX, e.clientY); if (!ptr.size) down = null; prev = snap(); };

canvas.addEventListener('wheel', e => { e.preventDefault(); cam.dist = Math.max(120, Math.min(14000, cam.dist * (e.deltaY > 0 ? 1.12 : 1 / 1.12))); }, {passive: false});
const ray = new THREE.Raycaster();
function groundAt(sx, sy){ ray.setFromCamera({x: sx / innerWidth * 2 - 1, y: -(sy / innerHeight) * 2 + 1}, camera); const h = ray.intersectObject(terrain)[0]; return h ? h.point : null; }
function tap(sx, sy){
  const g = groundAt(sx, sy);
  if (W.aim) { if (g) { if (W.aim === 'mlrs') { if (mlrsFire(g.x, g.z)) W.mlrsUsed++; } else { airStrike(g.x, g.z); W.airUsed++; } } W.aim = null; hint(''); ui(); return; }
  // أقرب وحدة على الشاشة
  let best = null, bd = 34;
  for (const u of W.units) { if (u.dead) continue; V3.set(u.x, hY(u.x, u.z) + (u.alt || 3), u.z).project(camera); const x = (V3.x + 1) / 2 * innerWidth, y = (1 - V3.y) / 2 * innerHeight, r = Math.hypot(x - sx, y - sy); if (V3.z < 1 && r < bd) { bd = r; best = u; } }

  if (best && best.side === 'tr') { W.sel.focus = best.id; W.sel.manual = null; log(`أمر: ${NAME[W.sel.t]} تهاجم ${NAME[best.t]} للعدو`, 'iq'); }
  else if (g) { W.sel.manual = {x: g.x, z: g.z}; W.sel.focus = null; log(`أمر: ${NAME[W.sel.t]} تتحرك إلى النقطة المحددة`, 'iq'); }

function hint(t){ const h = document.getElementById('hint'); h.textContent = t; h.hidden = !t; }
function selUI(){ const s = document.getElementById('sel'), u = W.sel; if (!u || u.dead) { s.hidden = true; return; } s.hidden = false; document.getElementById('selt').innerHTML = `<b>${NAME[u.t]}</b> · قوة ${Math.round(u.hp / UT[u.t].hp * 100)}% · معنويات ${Math.round(u.mor)}${u.sup > 55 ? ' · تحت النار' : ''}<br><small>اضغط مكاناً للتحرك أو عدواً للهجوم</small>`; }
document.getElementById('selx').onclick = () => { W.sel = null; selUI(); };
const $ = id => document.getElementById(id);
$('b-attack').onclick = () => { if (W.order === 'attack' && W.phase === 'prep') { W.t = Math.max(W.t, 20); } W.order = 'attack'; for (const u of W.units) if (u.side === 'iq') u.manual = null; ui(); };

const SPEEDS = [1, 3, 6]; $('b-speed').onclick = () => { SPEED = SPEEDS[(SPEEDS.indexOf(SPEED) + 1) % SPEEDS.length]; ui(); };

$('b-view').onclick = () => { const low = cam.pitch > .3; cam.pitch = low ? .16 : .55; cam.dist = low ? 900 : 2600; ui(); };
$('b-reset').onclick = () => { setup(); ui(); };
function uiCam(){ $('b-cam').classList.toggle('on', cam.follow); $('b-cam').querySelector('small').textContent = cam.follow ? 'تتبع' : 'حرة'; }
function ui(){
  $('b-attack').classList.toggle('on', W.order === 'attack'); $('b-hold').classList.toggle('on', W.order === 'hold');
  $('b-attack').querySelector('small').textContent = W.phase === 'prep' ? `تمهيد ${Math.max(0, Math.ceil(20 - W.t))} ث` : 'تقدم';
  $('b-mlrs').classList.toggle('on', W.aim === 'mlrs'); $('b-air').classList.toggle('on', W.aim === 'air');
  $('b-mlrs').disabled = W.mlrsUsed >= 3; $('b-air').disabled = W.airUsed >= 2;
  $('b-speed').querySelector('small').textContent = '×' + SPEED; $('b-view').querySelector('small').textContent = cam.pitch > .3 ? 'منخفضة' : 'عالية';
  const m = Math.floor(W.t / 60), s = Math.floor(W.t % 60); $('time').textContent = `${m}:${String(s).padStart(2, '0')}`;
  const c = (side, t) => W.units.filter(u => u.side === side && !u.dead && u.t === t).length;
  $('force').innerHTML = `<span style="color:var(--mine)">دبابات ${c('iq', 'tank')} · مشاة ${c('iq', 'squad')}</span> — <span style="color:var(--foe)">${c('tr', 'tank')} دبابات · ${c('tr', 'squad')} مشاة</span>`;
  selUI();

// ================================================================== الحلقة: محاكاة بخطوات ثابتة، ورسم، وعداد إطارات
const DUMMY = new THREE.Object3D();
function drawSoldiers(){
  for (const side of ['iq', 'tr']) {
    const im = SOLDIERS[side]; let n = 0;
    for (const u of W.units) {
      if (u.side !== side || u.dead || !u.men) continue;
      const prone = u.sup > 55 || u.dug;
      for (const s of u.men) { const p = soldierPos(u, s); DUMMY.position.set(p.x, p.y - 1.2 - (u.dug ? .7 : 0), p.z); DUMMY.rotation.set(prone ? -1.45 : 0, u.yaw, 0, 'YXZ'); DUMMY.scale.setScalar(S_UNIT); DUMMY.updateMatrix(); im.setMatrixAt(n++, DUMMY.matrix); }
    }
    im.count = n; im.instanceMatrix.needsUpdate = true;
  }
}
let last = performance.now(), acc = 0, fpsN = 0, fpsT = 0, lowT = 0, uiT = 0;
function frame(now){
  const real = Math.min(.05, (now - last) / 1000); last = now;
  if (!W.end) { acc += real * SPEED; while (acc > .05) { step(.05); acc -= .05; } }
  stepParticles(real * Math.max(1, SPEED * .6));
  updateCamera(real);
  for (const u of W.units) if (!u.dead || u.m) place(u);
  drawSoldiers();
  // خطوط الرصاص: خط قصير يتحرك مع الطلقة

  for (const p of W.proj) {
    if (n >= TRMAX || p.delay > 0) continue;
    if (p.k !== 'bullet' && p.k !== 'shell') continue;
    const dir = TMP.copy(p.to).sub(p.p).normalize(), L = p.k === 'shell' ? 30 : 9;
    P.set([p.p.x, p.p.y, p.p.z, p.p.x - dir.x * L, p.p.y - dir.y * L, p.p.z - dir.z * L], n * 6);
    const c = p.k === 'shell' ? [1, .95, .8] : p.side === 'iq' ? [1, .75, .35] : [1, .45, .3]; C.set([c[0], c[1], c[2], c[0] * .2, c[1] * .2, c[2] * .2], n * 6); n++;
  }

  }
  renderer.render(scene, camera);
  // عداد الإطارات، وتخفيض الدقة تلقائياً إذا نزل الأداء

  if (fpsT >= 1) { const f = Math.round(fpsN / fpsT); $('fps').textContent = f; $('fps').style.color = f >= 55 ? 'var(--good)' : f >= 40 ? 'var(--mine)' : 'var(--foe)'; if (f < 45) lowT++; else lowT = 0; if (lowT >= 3 && PR > 1) { PR = Math.max(1, PR - .25); renderer.setPixelRatio(PR); resize(); lowT = 0; } fpsN = 0; fpsT = 0; }
  requestAnimationFrame(frame);
}
function resize(){ renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
setup(); ui(); uiCam();
$('load').remove();
window.__W = () => W; window.__cam = cam; window.__step = step; window.__mlrs = mlrsFire; window.__air = airStrike;
